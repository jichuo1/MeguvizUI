[versions]
agp = "9.4.1"
kotlin = "2.4.21"
junit = "4.13.2"
appcompat = "1.8.0"
lumen = "1.5.5"
meguviz-ref = "1.0.0"
# This candidate is explicitly approved and SHA-pinned in upstream-candidates.toml.
#noinspection GradleDependency,NewerVersionAvailable
meguviz-upstream = "0.1.0-SNAPSHOT"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
lumen-engine = { module = "com.github.jichuo1.LumenCoacervationEngine:lumen-engine", version.ref = "lumen" }
meguviz-ref-core = { module = "io.github.jichuo1.meguviz:meguviz-ref-core", version.ref = "meguviz-ref" }
meguviz-android-runtime = { module = "io.github.jichuo1.meguviz:meguviz-android-runtime", version.ref = "meguviz-upstream" }
meguviz-android-window = { module = "io.github.jichuo1.meguviz:meguviz-android-window", version.ref = "meguviz-upstream" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
